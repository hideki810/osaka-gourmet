  }
  *{box-sizing:border-box;}
  body{

  }

  header{
    padding:28px 20px 18px;
    border-bottom:3px double var(--ink);
    position:relative;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.25em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:26px;
    margin:0;
    letter-spacing:0.04em;
  }
  .stamp{
    position:absolute;
    top:22px;
    right:20px;
    width:56px;
    height:56px;
    border:2.5px solid var(--stamp);
    border-radius:6px;
    color:var(--stamp);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:13px;
    line-height:1.1;
    text-align:center;
    transform:rotate(-6deg);
    opacity:0.85;
  }

  .toolbar{
    padding:16px 20px 0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .row2{display:flex; gap:8px;}
  input[type=text], select{
    width:100%;
    padding:11px 12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    background:var(--card);
    font-family:inherit;
    font-size:14px;
    color:var(--ink);
  }
  select{flex:1;}
  .count{
    font-size:12px;
    color:var(--ink-soft);
    padding:6px 20px 0;
  }

  .list{
    padding:14px 16px 0;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    position:relative;
    box-shadow:0 1px 0 rgba(43,38,33,0.04);
  }
  .card.visited{
    opacity:0.62;
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .name{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:17px;
    line-height:1.4;
  }
  .tags{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:6px;
  }
  .tag{
    font-size:11px;
    padding:2px 8px;
    border-radius:20px;
    border:1px solid var(--gold);
    color:var(--gold);
    white-space:nowrap;
  }
  .tag.area{
    border-color:var(--stamp);
    color:var(--stamp);
  }
  .memo{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:8px;
    line-height:1.5;
    white-space:pre-wrap;
  }
  .meta{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:6px;
    line-height:1.6;
  }
  .meta span{display:block;}
  .actions{
    display:flex;
    gap:14px;
    margin-top:10px;
    align-items:center;
  }
  .actions a, .actions button{
    font-size:12.5px;
    border:none;
    background:none;
    color:var(--ink-soft);
    padding:0;
    cursor:pointer;
    text-decoration:none;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .actions a.map{color:var(--stamp); font-weight:600;}
  .visited-check{
    font-size:12px;
    display:flex;
    align-items:center;
    gap:5px;
    color:var(--ink-soft);
    cursor:pointer;
    user-select:none;

    border-radius:18px 18px 0 0;
    padding:20px;

    font-size:18px;

    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:4px;

    width:100%;
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    background:var(--card);
    font-family:inherit;
    font-size:14px;
    color:var(--ink);

  .field textarea{min-height:64px; resize:vertical;}
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:16px;
  }
  .btn{
    flex:1;
    padding:12px;
    border-radius:8px;
    border:none;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }

  .btn.cancel{background:transparent; border:1.5px solid var(--line); color:var(--ink-soft);}
  .btn.delete{background:transparent; color:var(--stamp); border:1.5px solid var(--stamp-soft); flex:0 0 auto; padding:12px 16px;}

    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-size:13px;
  }
  .loading{
    text-align:center;
    padding:40px;
    color:var(--ink-soft);
    font-size:13px;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">MY OSAKA GOURMET NOTE</div>
  <h1>食べに行きたいお店</h1>
  <div class="stamp">保存<br>控</div>
</header>

<div class="toolbar">
  <input type="text" id="searchInput" placeholder="店名・メモで検索">
  <div class="row2">
    <select id="areaFilter"></select>
    <select id="visitFilter">
      <option value="all">すべて</option>
      <option value="not">未訪問のみ</option>
      <option value="visited">訪問済のみ</option>
    </select>
  </div>
</div>
<div class="count" id="countLabel"></div>

<div class="list" id="list">
  <div class="loading">読み込み中…</div>
</div>

<button class="fab" id="addBtn">＋</button>

<div class="sheet-backdrop" id="backdrop">
  <div class="sheet">
    <h2 id="sheetTitle">お店を追加</h2>
    <div class="field">
      <label>店名(分かれば)</label>
      <input type="text" id="f_name" placeholder="例：麵屋◯◯">
    </div>
    <div class="field">
      <label>エリア</label>
      <input type="text" id="f_area" placeholder="例：京橋、心斎橋">
    </div>
    <div class="field">
      <label>ジャンル</label>
      <input type="text" id="f_genre" placeholder="例：ラーメン、タイ料理">
    </div>
    <div class="field">
      <label>住所</label>
      <input type="text" id="f_address" placeholder="分かれば正確な住所を">
    </div>
    <div class="field">
      <label>営業時間・定休日</label>
      <input type="text" id="f_hours" placeholder="例：11:00〜22:00 水曜定休">
    </div>
    <div class="field">
      <label>電話番号</label>
      <input type="text" id="f_phone" placeholder="例：06-1234-5678">
    </div>
    <div class="field">
      <label>メモ</label>
      <textarea id="f_memo" placeholder="投稿の見出しや気になった理由など"></textarea>
    </div>
    <div class="sheet-actions">
      <button class="btn delete" id="deleteBtn" style="display:none;">削除</button>
      <button class="btn cancel" id="cancelBtn">キャンセル</button>
      <button class="btn save" id="saveBtn">保存</button>
    </div>
  </div>
</div>

async function saveShops(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(shops), false);
  }catch(e){
    console.error('保存に失敗しました', e);
  }
}

function renderAreaFilter(){
  const areas = Array.from(new Set(shops.map(s => s.area).filter(Boolean))).sort();
  const sel = document.getElementById('areaFilter');
  sel.innerHTML = '<option value="all">全エリア</option>' +
    areas.map(a => `<option value="${escapeAttr(a)}">${escapeHtml(a)}</option>`).join('');
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

function mapUrl(shop){
  if(shop.address){
    return 'https://www.google.com/maps/search/' + encodeURIComponent(shop.address + ' ' + (shop.name||''));
  }
  const q = [shop.name, shop.area, '大阪'].filter(Boolean).join(' ');
  return 'https://www.google.com/maps/search/' + encodeURIComponent(q);
}

function render(){
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const areaVal = document.getElementById('areaFilter').value;
  const visitVal = document.getElementById('visitFilter').value;

  let filtered = shops.filter(s => {
    if(areaVal !== 'all' && s.area !== areaVal) return false;
    if(visitVal === 'visited' && !s.visited) return false;
    if(visitVal === 'not' && s.visited) return false;
    if(search){
      const hay = [s.name, s.area, s.genre, s.memo, s.address].join(' ').toLowerCase();
      if(!hay.includes(search)) return false;
    }
    return true;
  });

  document.getElementById('countLabel').textContent = `${filtered.length}件 / 全${shops.length}件`;

  const list = document.getElementById('list');
  if(filtered.length === 0){
    list.innerHTML = '<div class="empty">該当するお店がありません。<br>右下の＋から追加できます。</div>';
    return;
  }

  list.innerHTML = filtered.map(s => `
    <div class="card ${s.visited ? 'visited' : ''}" data-id="${s.id}">
      <div class="card-top">
        <div>
          <div class="name">${escapeHtml(s.name) || '(店名未定)'}</div>
          <div class="tags">
            ${s.area ? `<span class="tag area">${escapeHtml(s.area)}</span>` : ''}
            ${s.genre ? `<span class="tag">${escapeHtml(s.genre)}</span>` : ''}
          </div>
        </div>
      </div>
      ${s.memo ? `<div class="memo">${escapeHtml(s.memo)}</div>` : ''}
      ${(s.address || s.hours || s.phone) ? `<div class="meta">
        ${s.address ? `<span>📍 ${escapeHtml(s.address)}</span>` : ''}
        ${s.hours ? `<span>🕒 ${escapeHtml(s.hours)}</span>` : ''}
        ${s.phone ? `<span>☎ ${escapeHtml(s.phone)}</span>` : ''}
      </div>` : ''}
      <div class="actions">
        <a class="map" href="${mapUrl(s)}" target="_blank" rel="noopener">📍 地図で見る</a>
        <button class="edit-btn">✎ 編集</button>
        <label class="visited-check">
          <input type="checkbox" class="visited-toggle" ${s.visited ? 'checked' : ''}>
          行った
        </label>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.card').forEach(card => {
    const id = card.dataset.id;
    card.querySelector('.edit-btn').addEventListener('click', () => openSheet(id));
    card.querySelector('.visited-toggle').addEventListener('change', async (e) => {
      const shop = shops.find(s => s.id === id);
      shop.visited = e.target.checked;
      await saveShops();
      render();
    });
  });
}

function openSheet(id){
  editingId = id;
  const backdrop = document.getElementById('backdrop');
  const deleteBtn = document.getElementById('deleteBtn');
  if(id){
    const shop = shops.find(s => s.id === id);
    document.getElementById('sheetTitle').textContent = 'お店を編集';
    document.getElementById('f_name').value = shop.name || '';
    document.getElementById('f_area').value = shop.area || '';
    document.getElementById('f_genre').value = shop.genre || '';
    document.getElementById('f_address').value = shop.address || '';
    document.getElementById('f_hours').value = shop.hours || '';
    document.getElementById('f_phone').value = shop.phone || '';
    document.getElementById('f_memo').value = shop.memo || '';
    deleteBtn.style.display = 'block';
  } else {
    document.getElementById('sheetTitle').textContent = 'お店を追加';
    document.getElementById('f_name').value = '';
    document.getElementById('f_area').value = '';
    document.getElementById('f_genre').value = '';
    document.getElementById('f_address').value = '';
    document.getElementById('f_hours').value = '';
    document.getElementById('f_phone').value = '';
    document.getElementById('f_memo').value = '';
    deleteBtn.style.display = 'none';
  }
  backdrop.classList.add('open');
}

function closeSheet(){
  document.getElementById('backdrop').classList.remove('open');
  editingId = null;
}

document.getElementById('addBtn').addEventListener('click', () => openSheet(null));
document.getElementById('cancelBtn').addEventListener('click', closeSheet);
document.getElementById('backdrop').addEventListener('click', (e) => {
  if(e.target.id === 'backdrop') closeSheet();
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  const name = document.getElementById('f_name').value.trim();
  const area = document.getElementById('f_area').value.trim();
  const genre = document.getElementById('f_genre').value.trim();
  const address = document.getElementById('f_address').value.trim();
  const hours = document.getElementById('f_hours').value.trim();
  const phone = document.getElementById('f_phone').value.trim();
  const memo = document.getElementById('f_memo').value.trim();

  if(editingId){
    const shop = shops.find(s => s.id === editingId);
    shop.name = name; shop.area = area; shop.genre = genre;
    shop.address = address; shop.hours = hours; shop.phone = phone; shop.memo = memo;
  } else {
    shops.unshift({id: uid(), name, area, genre, address, hours, phone, memo, visited:false});
  }
  await saveShops();
  renderAreaFilter();
  render();
  closeSheet();
});

document.getElementById('deleteBtn').addEventListener('click', async () => {
  shops = shops.filter(s => s.id !== editingId);
  await saveShops();
  renderAreaFilter();
  render();
  closeSheet();
});

document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('areaFilter').addEventListener('change', render);
document.getElementById('visitFilter').addEventListener('change', render);

loadShops();
</script>
